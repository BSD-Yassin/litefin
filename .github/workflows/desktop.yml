# ==============================================================================
# Litefin Desktop Multi-Platform Build Workflow
# ==============================================================================
# Builds native desktop applications (Windows, Linux, macOS) via Pake / Tauri.
#
# Triggers:
# - release: Triggers whenever a GitHub release is published to compile and
#            attach desktop binaries directly to the release.
# - workflow_dispatch: Allows on-demand manual packaging of any branch or tag.
# ==============================================================================

name: Desktop Builds

on:
  workflow_dispatch:
  release:
    types: [published]

jobs:
  build-desktop:
    name: Build (${{ matrix.platform.name }})
    runs-on: ${{ matrix.platform.os }}
    permissions:
      contents: write

    strategy:
      fail-fast: false
      matrix:
        platform:
          - name: Windows
            os: windows-latest
            script: npm run build:windows
            artifacts: |
              Litefin.exe
              *.msi

          - name: macOS
            os: macos-latest
            script: npm run build:macos
            artifacts: |
              *.dmg

          - name: Linux
            os: ubuntu-latest
            script: npm run build:linux
            artifacts: |
              *.deb
              *.AppImage

    steps:
      # ------------------------------------------------------------------------
      # Step 1: Check out source code at the target ref
      # ------------------------------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.release.tag_name || github.ref }}

      # ------------------------------------------------------------------------
      # Step 2: Setup Node.js runtime environment
      # ------------------------------------------------------------------------
      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      # ------------------------------------------------------------------------
      # Step 3: Setup Rust toolchain (required for Tauri / Pake compilation)
      # ------------------------------------------------------------------------
      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # ------------------------------------------------------------------------
      # Step 4: Install native Linux build dependencies (WebKitGTK, AppIndicator)
      # ------------------------------------------------------------------------
      - name: Install Linux system dependencies
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libappindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev

      # ------------------------------------------------------------------------
      # Step 5: Install npm project dependencies
      # ------------------------------------------------------------------------
      - name: Install project dependencies
        run: npm install

      # ------------------------------------------------------------------------
      # Step 6: Build modern web bundle and compile desktop executable
      # ------------------------------------------------------------------------
      - name: Build Desktop Application
        run: ${{ matrix.platform.script }}

      # ------------------------------------------------------------------------
      # Step 7: Attach desktop binaries to published GitHub release
      # ------------------------------------------------------------------------
      - name: Upload Binaries to GitHub Release
        if: github.event_name == 'release'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.event.release.tag_name }}
          files: ${{ matrix.platform.artifacts }}
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      # ------------------------------------------------------------------------
      # Step 8: Upload build artifacts for manual workflow dispatch runs
      # ------------------------------------------------------------------------
      - name: Upload Artifacts (Manual Run)
        if: github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: litefin-${{ matrix.platform.name }}
          path: ${{ matrix.platform.artifacts }}
